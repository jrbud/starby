<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>sprite.exe — settings</title>
    <link rel="stylesheet" href="../shared/menuFrame.css" />
    <link rel="stylesheet" href="settings.css" />
    <!-- Zooms the page to the window for the UI size setting (before the page's own scripts). -->
    <script src="../shared/menuZoom.js"></script>
    <!-- Checkbox art, loaded up front so the first hover/click doesn't flicker. -->
    <link rel="preload" as="image" href="../../../assets/menuIcons/unchecked-box-hover.png" />
    <link rel="preload" as="image" href="../../../assets/menuIcons/checked-box-idle.png" />
    <link rel="preload" as="image" href="../../../assets/menuIcons/checked-box-hover.png" />
    <link rel="preload" as="image" href="../../../assets/menuIcons/unchecked-box-idle.png" />
    <link rel="preload" as="image" href="../../../assets/menuIcons/yellow-square-hover.png" />
    <link rel="preload" as="image" href="../../../assets/menuIcons/white-square-idle.png" />
    <link rel="preload" as="image" href="../../../assets/menuIcons/white-square-hover.png" />
    <link rel="preload" as="image" href="../../../assets/menuIcons/button-white-dark.png" />
    <link rel="preload" as="image" href="../../../assets/menuIcons/button-red-hover.png" />
    <!-- Slider art (settings.css): the line track and the yellow starbit handle. -->
    <link rel="preload" as="image" href="../../../assets/menuIcons/line.png" />
    <link rel="preload" as="image" href="../../../assets/starbits/yellow1.png" />
  </head>
  <body class="menu-window">
    <!-- The background art (assets/backgrounds/settings.png) has "SETTINGS" written on it. -->
    <h1 class="sr-only">Settings</h1>
    <div class="menu-drag"></div>
    <button id="close" class="close-button" type="button" title="Close" aria-label="Close settings">
      <img class="idle" src="../../../assets/menuIcons/x-idle.png" alt="" draggable="false" />
      <img class="hover" src="../../../assets/menuIcons/x-hover.png" alt="" draggable="false" />
    </button>

    <!-- The art's grey panel; everything below scrolls inside it. -->
    <main class="menu-panel settings-scroll">
      <div class="settings-content">
    <!-- Starby: his size on screen (settingsStore.starbySize; pet.js resizes him live) and how hard
         throws fly (flingPower). First section; starts collapsed like the others. -->
    <details class="group" data-key="starby">
      <summary>
        <span class="group-title">Starby</span>
      </summary>
      <div class="group-body">
    <!-- What he calls you (settingsStore.userName; also asked in the welcome window). Empty = "friend". -->
    <section class="setting name-setting">
      <label for="user-name">Your name</label>
      <input id="user-name" type="text" maxlength="20" placeholder="friend" autocomplete="off" spellcheck="false" />
    </section>

    <section class="setting">
      <div class="label-row">
        <label for="starby-size">Size</label>
        <output id="starby-size-value" for="starby-size">100 px</output>
      </div>
      <input id="starby-size" type="range" min="50" max="150" step="5" value="100" />
    </section>

    <section class="setting">
      <div class="label-row">
        <label for="fling-power">Fling power</label>
        <output id="fling-power-value" for="fling-power">50</output>
      </div>
      <input id="fling-power" type="range" min="0" max="100" step="1" value="50" />
    </section>

    <!-- Same setting as Games → "Game Prompts" (settingsStore.gameInvites): the two boxes
         are linked (settings.js SWITCHES), ticking either one changes both. -->
    <section class="setting switches">
      <!-- Random things he says while walking around (settingsStore.idleChats; pet/behaviors/speech.js). -->
      <label class="switch-row">
        <span class="switch-name">Idle chats</span>
        <input id="idle-chats" type="checkbox" class="art-check" />
      </label>
      <label class="switch-row">
        <span class="switch-name">Game Prompts</span>
        <input id="starby-game-invites" type="checkbox" class="art-check" />
      </label>
    </section>
      </div>
    </details>

    <!-- UI sizes, 75–150 % (settingsStore menuScale / chatScale / fontScale; settings.js saves them
         when you let go of the slider). Menu size: the shop/settings windows + the right-click menu's
         answer boxes. Chat size: speech + thought bubbles. Font size: text in bubbles and menus. -->
    <details class="group" data-key="ui">
      <summary>
        <span class="group-title">UI</span>
      </summary>
      <div class="group-body">

    <section class="setting">
      <div class="label-row">
        <label for="menu-scale">Menu size</label>
        <output id="menu-scale-value" for="menu-scale">100%</output>
      </div>
      <input id="menu-scale" type="range" min="75" max="150" step="5" value="100" />
    </section>

    <section class="setting">
      <div class="label-row">
        <label for="chat-scale">Chat size</label>
        <output id="chat-scale-value" for="chat-scale">100%</output>
      </div>
      <input id="chat-scale" type="range" min="75" max="150" step="5" value="100" />
    </section>

    <section class="setting">
      <div class="label-row">
        <label for="font-scale">Font size</label>
        <output id="font-scale-value" for="font-scale">100%</output>
      </div>
      <input id="font-scale" type="range" min="75" max="150" step="5" value="100" />
    </section>

      </div>
    </details>

    <!-- Sounds (played by shared/sfx.js). The box in the header turns ALL sounds on/off (checked =
         on; saved as settingsStore.sfxMuted, reversed). "All sounds" = master volume (sfxVolume);
         below it, one slider + on/off box per category, built by settings.js from SOUND_CATEGORIES
         in shared/sfx.js. Letting go of a slider plays a sample. -->
    <details class="group" data-key="sounds">
      <summary>
        <span class="group-title">Sounds</span>
        <input id="sfx-on" type="checkbox" class="art-check header-toggle" aria-label="Sounds on" title="All sounds on/off" />
      </summary>
      <div class="group-body">

    <section class="setting">
      <div class="label-row">
        <label for="sfx-volume">All sounds</label>
        <output id="sfx-volume-value" for="sfx-volume">70%</output>
      </div>
      <input id="sfx-volume" type="range" min="0" max="150" step="1" value="70" />
    </section>

    <!-- One per category: name, %, slider and on/off box (settings.js). -->
    <div id="sound-categories"></div>

      </div>
    </details>



    <!-- Collapsible: click the heading (or Enter/Space). Every section starts collapsed each time Settings opens (settings.js).
         The box in the header turns starbit spawning on/off (settingsStore.starbitSpawning). -->
    <details class="group" data-key="starbits">
      <summary>
        <span class="group-title">Starbits</span>
        <input id="starbit-spawning" type="checkbox" class="art-check header-toggle" aria-label="Starbits spawning" title="Starbits spawning on/off" />
      </summary>
      <div class="group-body">

    <section class="setting switches">
      <label class="switch-row">
        <span class="switch-name">Visible</span>
        <input id="starbit-visible" type="checkbox" class="art-check" />
      </label>
      <label class="switch-row">
        <span class="switch-name">Shooting animation</span>
        <input id="starbit-shoot" type="checkbox" class="art-check" />
      </label>
      <!-- The starbit count card at the top right when you collect one (settingsStore.starbitShowCount). -->
      <label class="switch-row">
        <span class="switch-name">Show count on collect</span>
        <input id="starbit-show-count" type="checkbox" class="art-check" />
      </label>
    </section>

    <section class="setting">
      <div class="label-row">
        <span class="label" id="starbit-colors-label">Color</span>
<!--        <output id="starbit-colors-count"></output>-->
      </div>
      <!-- One checkbox per color in renderer/shared/starbitArt.js (built by settings.js). -->
      <div id="starbit-colors" class="color-grid" role="group" aria-labelledby="starbit-colors-label"></div>
    </section>

    <section class="setting">
      <div class="label-row">
        <label for="starbit-size">Size</label>
        <output id="starbit-size-value" for="starbit-size">20 px</output>
      </div>
      <div class="size-row">
        <input id="starbit-size" type="range" min="10" max="48" step="1" value="20" />
        <!-- Live preview at the chosen size (team art). -->
        <div class="size-preview"><img id="starbit-size-preview" alt="" draggable="false" /></div>
      </div>
    </section>

      </div>
    </details>

    <!-- Games: the box in the header turns ALL games on/off (settingsStore.gamesEnabled); then whether
         Starby starts games on his own (gameInvites), and one on/off box per game (gamesOff = the
         ones switched OFF). Game rows are built by settings.js. -->
    <details class="group" data-key="games">
      <summary>
        <span class="group-title">Games</span>
        <input id="games-on" type="checkbox" class="art-check header-toggle" aria-label="Games on" title="All games on/off" />
      </summary>
      <div class="group-body">
    <section class="setting switches">
      <label class="switch-row">
        <span class="switch-name">Game Prompts</span>
        <input id="game-invites" type="checkbox" class="art-check" />
      </label>
    </section>
    <!-- One box per game (built by settings.js); the group's gap separates it from Game Prompts. -->
    <section class="setting switches">
      <div id="game-toggles"></div>
    </section>
      </div>
    </details>

    <!-- App: the welcome window at launch (settingsStore.showWelcome) and starting with Windows
         (src/main/startup.js; only in the built app, disabled while developing). -->
    <details class="group" data-key="app">
      <summary>
        <span class="group-title">App</span>
      </summary>
      <div class="group-body">
    <section class="setting switches">
      <label class="switch-row">
        <span class="switch-name">Show welcome window at launch</span>
        <input id="show-welcome" type="checkbox" class="art-check" />
      </label>
      <label class="switch-row" id="run-at-startup-row">
        <span class="switch-name">Start Starby when Windows starts</span>
        <input id="run-at-startup" type="checkbox" class="art-check" />
      </label>
    </section>
      </div>
    </details>

    <!-- Lifetime stats (read-only; src/main/statsStore.js, filled in by settings.js). Not touched by
         Restore default or Reset progress. -->
    <details class="group" data-key="stats">
      <summary>
        <span class="group-title">Stats</span>
      </summary>
      <div class="group-body">
    <!-- Rows are built by settings.js from STAT_GROUPS; per-game rows from what's been played. -->
    <div id="stats-groups" class="stats-groups"></div>
      </div>
    </details>

    <div class="reset-row">
      <button id="reset" type="button">Restore default</button>
      <!-- Wipes starbits + shop progress after a few confirm clicks (settings.js). -->
      <button id="reset-progress" type="button" aria-live="polite">Reset progress</button>
    </div>

      </div>
    </main>

    <script type="module" src="settings.js"></script>
  </body>
</html>
