<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>sprite.exe — shop</title>
    <link rel="stylesheet" href="../shared/menuFrame.css" />
    <link rel="stylesheet" href="shop.css" />
    <!-- Zooms the page to the window for the UI size setting (before the page's own scripts). -->
    <script src="../shared/menuZoom.js"></script>
    <!-- Button art used on hover / in other states, loaded up front so swapping never flickers. -->
    <link rel="preload" as="image" href="../../../assets/menuIcons/button-tan-hover.png" />
    <link rel="preload" as="image" href="../../../assets/menuIcons/button-green-idle.png" />
    <link rel="preload" as="image" href="../../../assets/menuIcons/button-green-hover.png" />
    <link rel="preload" as="image" href="../../../assets/menuIcons/button-white-dark.png" />
  </head>
  <body class="menu-window">
    <!-- The background art (assets/backgrounds/shop.png) has "SHOP" written on it. -->
    <h1 class="sr-only">Shop</h1>
    <div class="menu-drag"></div>
    <button id="close" class="close-button" title="Close" aria-label="Close shop">
      <img class="idle" src="../../../assets/menuIcons/x-idle.png" alt="" draggable="false" />
      <img class="hover" src="../../../assets/menuIcons/x-hover.png" alt="" draggable="false" />
    </button>

    <main class="panel menu-panel">
      <section class="left">
        <div class="wallet" title="Your starbits">
          <img class="starbit-icon" src="../../../assets/starbits/cluster.png" alt="" />
          <span id="balance">0</span>
        </div>
        <!-- Starby runs in here and stands still while the shop is open (events/shop.js). -->
        <div id="display" class="display-box"></div>
        <button id="action" class="action-button">Buy</button>
      </section>

      <section id="lists" class="right"></section>
    </main>

    <script type="module" src="shop.js"></script>
  </body>
</html>
